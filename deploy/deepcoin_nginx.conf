# HTTP · IP 187.77.130.144 交易 Webhook（与 twinstar-https.conf 分离）

server {
    listen 80;
    server_name 187.77.130.144 _;

    location /coinw/webhook {
        proxy_pass http://127.0.0.1:5002/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /binance/webhook {
        proxy_pass http://127.0.0.1:5000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /deepcoin/webhook {
        proxy_pass http://127.0.0.1:5004/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # 关键修复：关闭 proxy buffering，让 nginx 立即转发响应给 TV
        proxy_buffering off;
        # 关键修复：关闭 request buffering，避免 nginx 缓冲整个请求体
        proxy_request_buffering off;
    }

    location /deepcoin/health {
        proxy_pass http://127.0.0.1:5004/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /deepcoin-b/webhook {
        proxy_pass http://127.0.0.1:5005/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /deepcoin-b/health {
        proxy_pass http://127.0.0.1:5005/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
